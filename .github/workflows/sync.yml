name: Sync a repo-seed target

# Reusable workflow: keeps one pull request open on chore/repo-seed-sync while a
# repository's managed files differ from the repo-seed release. See the README.

on:
  workflow_call:
    inputs:
      pack-version:
        description: "Pin a pack release such as 5.19.0 instead of using the latest."
        type: string
        required: false
        default: ""
    secrets:
      token:
        description: "Optional PAT or GitHub App token for checks without manual run approval."
        required: false

permissions:
  contents: read

concurrency:
  group: repo-seed-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    env:
      # The repository that publishes the pack. Not the caller.
      PACK_REPOSITORY: Trawis/repo-seed
      SYNC_BRANCH: chore/repo-seed-sync
      PACK_VERSION_INPUT: ${{ inputs.pack-version }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check that this repository can be synced
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f .repo-seed-state.json ]; then
            echo "::notice::No .repo-seed-state.json, so this repository does not use repo-seed. Skipping."
            exit 0
          fi
          base=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)
          if [ "$GITHUB_REF_NAME" != "$base" ]; then
            echo "::notice::Run on '$GITHUB_REF_NAME', not the default branch '$base'. Skipping."
            exit 0
          fi
          echo "SYNC_BASE=$base" >> "$GITHUB_ENV"
          echo "CAN_SYNC=true" >> "$GITHUB_ENV"

      - name: Download the repo-seed release
        if: env.CAN_SYNC == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$PACK_VERSION_INPUT" ]; then
            if ! printf '%s' "$PACK_VERSION_INPUT" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::pack-version must look like 5.19.0"
              exit 1
            fi
            tag="v$PACK_VERSION_INPUT"
          else
            tag=$(gh release view --repo "$PACK_REPOSITORY" --json tagName --jq .tagName)
          fi
          version=${tag#v}
          pack_root="$RUNNER_TEMP/repo-seed-pack"
          mkdir -p "$pack_root"
          gh release download "$tag" --repo "$PACK_REPOSITORY" \
            --pattern "repo-seed-pack-${version}.zip" \
            --pattern "repo-seed-pack-${version}.zip.sha256" \
            --dir "$pack_root"
          (cd "$pack_root" && sha256sum --check "repo-seed-pack-${version}.zip.sha256")
          unzip -q "$pack_root/repo-seed-pack-${version}.zip" -d "$pack_root/extracted"
          echo "PACK_TAG=$tag" >> "$GITHUB_ENV"
          echo "PACK_DIR=$pack_root/extracted/pack" >> "$GITHUB_ENV"

      - name: Preview and apply the sync
        if: env.CAN_SYNC == 'true'
        run: |
          set -euo pipefail
          python "$PACK_DIR/files/scripts/sync-docs.py" \
            --source "$PACK_DIR" --target "$GITHUB_WORKSPACE" --dry-run \
            | tee "$RUNNER_TEMP/preview.txt"
          python "$PACK_DIR/files/scripts/sync-docs.py" \
            --source "$PACK_DIR" --target "$GITHUB_WORKSPACE"
          python "$PACK_DIR/files/scripts/sync-docs.py" \
            --source "$PACK_DIR" --target "$GITHUB_WORKSPACE" --audit \
            | tee "$RUNNER_TEMP/residual-audit.txt"
          if ! grep -qx 'no drift detected' "$RUNNER_TEMP/residual-audit.txt"; then
            echo '::warning::Some repo-seed audit findings need manual review.'
            {
              echo '### Remaining repo-seed audit findings'
              echo '```text'
              cat "$RUNNER_TEMP/residual-audit.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "CHANGED=false" >> "$GITHUB_ENV"
          fi

      - name: Open, update, or close the sync pull request
        if: env.CAN_SYNC == 'true'
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
        run: |
          set -euo pipefail
          pr_fields=number,headRefOid,body,isCrossRepository
          prs=$(gh pr list --head "$SYNC_BRANCH" --base "$SYNC_BASE" --state open --json "$pr_fields")
          pr=$(jq -c '[.[] | select(.isCrossRepository == false)] | if length > 1 then error("multiple sync pull requests") else .[0] // null end' <<< "$prs")
          number=$(jq -r '.number // empty' <<< "$pr")
          if [ "$CHANGED" != "true" ] && [ -z "$number" ]; then
            exit 0
          fi

          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          remote_git() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          ref="refs/heads/$SYNC_BRANCH"
          base_sha=$(git rev-parse HEAD)
          current_base=$(remote_git ls-remote --heads origin "refs/heads/$SYNC_BASE" | cut -f1)
          if [ "$SYNC_BASE" = "$SYNC_BRANCH" ] || [ "$base_sha" != "$current_base" ]; then
            echo '::error::The default branch changed during sync; retry from its current head.'
            exit 1
          fi
          remote=$(remote_git ls-remote --heads origin "$ref" | cut -f1)

          owned() {
            jq -e --arg sha "$remote" '(.headRefOid == $sha) and (((.body // "") | split("\n")) | index("<!-- repo-seed-sync-head: " + $sha + " -->") != null)' >/dev/null
          }
          if [ -n "$number" ]; then
            if [ -z "$remote" ] || ! owned <<< "$pr"; then
              echo '::error::The pending sync branch is not verified as automation-owned. Review its changes before retrying.'
              exit 1
            fi
          elif [ -n "$remote" ]; then
            history=$(gh pr list --head "$SYNC_BRANCH" --base "$SYNC_BASE" --state all --limit 100 --json "$pr_fields")
            if ! jq -e --arg sha "$remote" 'any(.[]; .isCrossRepository == false and .headRefOid == $sha and (((.body // "") | split("\n")) | index("<!-- repo-seed-sync-head: " + $sha + " -->") != null))' <<< "$history" >/dev/null; then
              echo '::error::An existing sync branch has no verified ownership record. Review it before retrying.'
              exit 1
            fi
          fi

          if [ "$CHANGED" != "true" ]; then
            if [ "$(remote_git ls-remote --heads origin "$ref" | cut -f1)" != "$remote" ]; then
              echo '::error::The sync branch changed; review it before closing the pull request.'
              exit 1
            fi
            gh pr close "$number" --comment "The files already match repo-seed $PACK_TAG; this update is no longer needed."
            exit 0
          fi

          git add -A
          desired_tree=$(git write-tree)
          head=
          if [ -n "$remote" ]; then
            remote_git fetch --no-tags --depth=1 origin "$ref"
            if [ "$(git rev-parse FETCH_HEAD)" != "$remote" ]; then
              echo '::error::The sync branch changed during inspection; retry after review.'
              exit 1
            fi
            if [ "$desired_tree" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
              if [ -n "$number" ]; then
                echo 'The pending sync pull request already contains the desired update.'
                exit 0
              fi
              head=$remote
            fi
          fi

          if [ -z "${head:-}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -B "$SYNC_BRANCH"
            git commit -q -m "Update repo-seed files to $PACK_TAG"
            head=$(git rev-parse HEAD)
            remote_git push --force-with-lease="$ref:$remote" origin "HEAD:$ref"
          fi

          {
            echo "<!-- repo-seed-sync-head: $head -->"
            echo "Updates the managed repo-seed files to $PACK_TAG. Preview:"
            echo
            echo '```text'
            head -c 50000 "$RUNNER_TEMP/preview.txt"
            echo
            echo '```'
            if grep -q 'no recorded baseline' "$RUNNER_TEMP/preview.txt"; then
              echo
              echo '**Some files had no recorded baseline.** Review the diff before merging.'
            fi
            if grep -q 'and discard local changes' "$RUNNER_TEMP/preview.txt"; then
              echo
              echo '**Some managed files contained local changes.** Review the diff before merging.'
            fi
            if ! grep -qx 'no drift detected' "$RUNNER_TEMP/residual-audit.txt"; then
              echo
              echo '### Remaining audit findings'
              echo '```text'
              head -c 10000 "$RUNNER_TEMP/residual-audit.txt"
              echo
              echo '```'
            fi
            echo
            echo 'Only managed files and .repo-seed-state.json change. Review the generated update; do not commit unrelated changes to its branch.'
          } > "$RUNNER_TEMP/pr-body.md"

          if [ -n "$number" ]; then
            gh pr edit "$number" --title "Update repo-seed files to $PACK_TAG" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --head "$SYNC_BRANCH" --base "$SYNC_BASE" \
              --title "Update repo-seed files to $PACK_TAG" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
