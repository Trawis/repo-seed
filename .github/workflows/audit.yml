name: Audit a repo-seed target

# Reusable workflow: keeps one issue open while a repository's managed files
# drift from the repo-seed release. See the README.
#
# Trust model: the release archive and its SHA-256 come from the same release, so
# the checksum detects corruption, not a compromised publisher. The script runs in
# the caller's checkout without the job token (checkout does not persist it, and
# only the two `gh` steps receive it), so it cannot use the token to write.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: repo-seed-audit-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    env:
      # The repository that publishes the pack. Not the caller.
      PACK_REPOSITORY: Trawis/repo-seed
      ISSUE_TITLE: "repo-seed: managed files are out of date"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check that this repository uses repo-seed
        run: |
          if [ -f .repo-seed-state.json ]; then
            echo "USES_REPO_SEED=true" >> "$GITHUB_ENV"
          else
            echo "::notice::No .repo-seed-state.json in this repository, so there is nothing to audit."
          fi

      - uses: actions/setup-python@v6
        if: env.USES_REPO_SEED == 'true'
        with:
          python-version: "3.13"

      - name: Download the latest repo-seed release
        if: env.USES_REPO_SEED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$PACK_REPOSITORY" --json tagName --jq .tagName)
          version=${tag#v}
          pack_root="$RUNNER_TEMP/repo-seed-pack"
          mkdir -p "$pack_root"
          gh release download "$tag" --repo "$PACK_REPOSITORY" \
            --pattern "repo-seed-pack-${version}.zip" \
            --pattern "repo-seed-pack-${version}.zip.sha256" \
            --dir "$pack_root"
          (cd "$pack_root" && sha256sum --check "repo-seed-pack-${version}.zip.sha256")
          unzip -q "$pack_root/repo-seed-pack-${version}.zip" -d "$pack_root/extracted"
          echo "PACK_TAG=$tag" >> "$GITHUB_ENV"
          echo "PACK_DIR=$pack_root/extracted/pack" >> "$GITHUB_ENV"

      - name: Audit this repository
        if: env.USES_REPO_SEED == 'true'
        run: |
          set -euo pipefail
          python "$PACK_DIR/files/scripts/sync-docs.py" \
            --source "$PACK_DIR" --target "$GITHUB_WORKSPACE" --audit \
            | tee "$RUNNER_TEMP/audit.txt"
          if grep -qx 'no drift detected' "$RUNNER_TEMP/audit.txt"; then
            echo "DRIFT=false" >> "$GITHUB_ENV"
          else
            echo "DRIFT=true" >> "$GITHUB_ENV"
          fi

      - name: Open, update, or close the drift issue
        if: env.USES_REPO_SEED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(gh repo view "$GITHUB_REPOSITORY" --json hasIssuesEnabled --jq .hasIssuesEnabled)" != "true" ]; then
            echo "::notice::Issues are disabled in this repository, so drift is reported only in the job log."
            exit 0
          fi
          numbers=$(gh issue list --state open --limit 1000 --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' \
            | awk -F '\t' -v title="$ISSUE_TITLE" '$2 == title { print $1 }')
          number=$(printf '%s\n' "$numbers" | head -n 1)
          if [ "$DRIFT" = "true" ]; then
            {
              echo "The latest repo-seed release is \`$PACK_TAG\`. \`sync-docs.py --audit\` reported:"
              echo
              echo '```text'
              cat "$RUNNER_TEMP/audit.txt"
              echo '```'
              echo
              echo "Review the changes with \`sync-docs.py --diff\` using the new pack, then update. This issue is kept up to date by the scheduled audit and closes itself when the audit is clean."
            } > "$RUNNER_TEMP/body.md"
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
            else
              gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/body.md"
            fi
          else
            for stale in $numbers; do
              gh issue close "$stale" --comment "The audit is clean against repo-seed \`$PACK_TAG\`."
            done
          fi
